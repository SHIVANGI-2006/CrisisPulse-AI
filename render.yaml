services:
  - type: web
    name: crisispulse-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ENABLE_LIVE_VERIFICATION
        value: "true"
      - key: DEMO_MODE
        value: "false"
